[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "sales-support-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi",
  "uvicorn",
  "websockets>=13,<18",
  "pydantic",
  "requests",
  "PyJWT[crypto]>=2.15.1,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg2-binary",
  "google-auth",
  "python-multipart",
  "anthropic>=0.40.0",
  "markdown",
  "openpyxl>=3.1,<4.0",
  "python-docx>=1.1,<2.0",
  "pdfplumber>=0.11,<1.0",
  "Pillow>=13.0,<14.0",
  "tzdata>=2025.2",
  "tldextract>=5.1,<6",
  "urllib3>=2.8.0,<3",
  "certifi>=2026.10.23",
  "pyasn1>=0.6.5,<0.7",
]

[project.scripts]
app = "sales_support_agent.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sales_support_agent*"]
