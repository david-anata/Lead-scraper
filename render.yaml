services:
  - type: web
    name: sales-support-agent
    runtime: python
    plan: starter
    # Website Ops currently maintains its report, quota, and publishing ledgers on
    # the service filesystem. Keep one writer until every ledger is database-backed.
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/predeploy_agent.py
    startCommand: uvicorn sales_support_agent.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: AGENT_PREPARE_DATABASE_ON_STARTUP
        value: "false"
      - key: WEBSITE_OPS_DATABASE_MIRROR
        value: "true"
      - key: WEBSITE_OPS_EMBEDDED_SCHEDULER
        value: "false"
      - key: OUTBOUND_EMBEDDED_SCHEDULER
        value: "false"
      - key: CLICKUP_API_TOKEN
        sync: false
      - key: CLICKUP_API_KEY
        sync: false
      - key: CLICKUP_LIST_ID
        sync: false
      - key: SALES_AGENT_INTERNAL_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: SLACK_AE_MAP_JSON
        sync: false
      - key: INSTANTLY_WEBHOOK_SECRET
        sync: false
      - key: INSTANTLY_WEBHOOK_SECRET_HEADER
        value: X-Instantly-Webhook-Secret
      - key: INSTANTLY_WEBHOOK_ALLOWED_EVENT_TYPES
        value: email_sent,reply_received,lead_meeting_booked,lead_meeting_completed,lead_interested,lead_not_interested,lead_neutral
      - key: CLICKUP_DISCOVERY_SAMPLE_SIZE
        value: "10"
      - key: CLICKUP_DISCOVERY_SNAPSHOT_PATH
        value: runtime/clickup_schema_snapshot.json
      - key: CLICKUP_USE_DUE_DATE_FOR_FOLLOW_UP
        value: "false"
      - key: STALE_LEAD_SCAN_MAX_TASKS
        value: "150"
      - key: SALES_AGENT_DB_URL
        sync: false
      - key: HR_PII_SECRET
        sync: false
      - key: HR_PAYROLL_ADMIN_EMAILS
        value: david@anatainc.com,val@anatainc.com
      - key: FULFILLMENT_CS_REPORTS_DIR
        sync: false
      - key: HUBSPOT_API_TOKEN
        sync: false
      - key: HUBSPOT_PORTAL_ID
        sync: false
      - key: HUBSPOT_SALES_PIPELINE_ID
        sync: false
      - key: HUBSPOT_DEFAULT_OWNER_ID
        sync: false
      - key: HUBSPOT_DEFAULT_SERVICE_LINE
        value: fulfillment
      - key: HUBSPOT_DEFAULT_LEAD_SOURCE_DETAIL
        value: agent
      - key: BUILDING_SITE_INTAKE_KEY
        sync: false
      - key: BUILDING_PUBLIC_BASE_URL
        value: https://anatabuilding.com
      - key: BUILDING_CAMPAIGN_TOKEN_SECRET
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Anata Agent <noreply@anatainc.com>
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_API_BASE_URL
        value: https://api.stripe.com
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_SALES_RANGE
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CONTENT_DRIVE_PARENT_ID
        value: 0APLEjKQW8NZlUk9PVA
      - key: CONTENT_DRIVE_VERIFIED
        value: "false"
      - key: CONTENT_RIVERSIDE_RELAY_ENABLED
        value: "false"
      - key: CONTENT_LINKEDIN_CONNECTOR_URL
        sync: false
      - key: CONTENT_LINKEDIN_CONNECTOR_KEY
        sync: false
      - key: CONTENT_LINKEDIN_CONNECTOR_VERIFIED
        value: "false"
      - key: CONTENT_YOUTUBE_CONNECTOR_URL
        sync: false
      - key: CONTENT_YOUTUBE_CONNECTOR_KEY
        sync: false
      - key: CONTENT_YOUTUBE_CONNECTOR_VERIFIED
        value: "false"
      - key: CONTENT_INSTAGRAM_CONNECTOR_URL
        sync: false
      - key: CONTENT_INSTAGRAM_CONNECTOR_KEY
        sync: false
      - key: CONTENT_INSTAGRAM_CONNECTOR_VERIFIED
        value: "false"
      - key: CONTENT_NEWSLETTER_PROVIDER
        sync: false
      - key: CONTENT_NEWSLETTER_AUDIENCE_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEBSITE_OPS_CITATION_TESTING_ENABLED
        value: "true"
      - key: WEBSITE_OPS_CITATION_PROVIDER
        value: auto
      - key: WEBSITE_OPS_OPENAI_CITATION_MODEL
        value: gpt-5-mini
      - key: WEBSITE_OPS_ANTHROPIC_CITATION_MODEL
        value: claude-sonnet-4-6
      - key: WEBSITE_OPS_CITATION_MAX_CLUSTERS
        value: "5"
      - key: WEBSITE_OPS_EXECUTE_APPROVED
        value: "true"
      - key: WEBSITE_OPS_ROOT
        value: runtime/website_ops
      - key: WEBSITE_OPS_SITEMAP_URL
        value: https://anatainc.com/sitemap.xml
      - key: WEBSITE_OPS_ALLOWED_HOST
        value: anatainc.com
      - key: WEBSITE_OPS_REPORT_EMAIL_TO
        value: david@anatainc.com
      - key: WEBSITE_OPS_EMAIL_FROM
        value: Anata Agent <noreply@anatainc.com>
      - key: WEBSITE_OPS_GITHUB_TOKEN
        sync: false
      - key: WEBSITE_OPS_GITHUB_REPOSITORY
        value: david-anata/anata-website
      - key: WEBSITE_OPS_GITHUB_BRANCH
        value: main
      - key: WEBSITE_OPS_DEPLOY_VERIFY_TIMEOUT_SECONDS
        value: "300"
      - key: WEBSITE_OPS_DEPLOY_VERIFY_POLL_SECONDS
        value: "15"
      - key: CANVA_CLIENT_ID
        sync: false
      - key: CANVA_CLIENT_SECRET
        sync: false
      - key: CANVA_REDIRECT_URI
        sync: false
      - key: CANVA_BRAND_TEMPLATE_ID
        sync: false
      - key: CANVA_TOKEN_SECRET
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: production
      - key: PLAID_TOKEN_SECRET
        sync: false
      - key: PLAID_WEBHOOK_URL
        value: https://agent.anatainc.com/api/integrations/plaid/webhook
      - key: PLAID_REDIRECT_URI
        value: https://agent.anatainc.com/admin/finances/plaid/oauth-return

  - type: cron
    name: website-ops-scheduler
    runtime: python
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: |
      curl -sS -X POST "$AGENT_URL/api/jobs/website-ops/run" \
        -H "Content-Type: application/json" \
        -H "X-Internal-Api-Key: $(printf %s "$SALES_AGENT_INTERNAL_API_KEY")" \
        -d '{"mode":"scheduled"}'
    envVars:
      - key: AGENT_URL
        value: https://agent.anatainc.com
      - key: SALES_AGENT_INTERNAL_API_KEY
        sync: false

  - type: cron
    name: content-engine-scheduler
    runtime: python
    # Render cron is UTC. The endpoint accepts only the local 6 AM invocation.
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: |
      curl --fail --silent --show-error \
        -X POST "$AGENT_URL/api/jobs/content/run" \
        -H "Content-Type: application/json" \
        -H "X-Internal-Api-Key: $(printf %s "$SALES_AGENT_INTERNAL_API_KEY")" \
        -d '{"mode":"scheduled"}'
    envVars:
      - key: AGENT_URL
        value: https://agent.anatainc.com
      - key: SALES_AGENT_INTERNAL_API_KEY
        sync: false

  - type: cron
    name: sales-support-stale-scan
    runtime: python
    schedule: "0 15 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: |
      curl -sS -X POST "$SALES_SUPPORT_AGENT_URL/api/jobs/stale-leads/run" \
        -H "Content-Type: application/json" \
        -H "X-Internal-Api-Key: $(printf %s "$SALES_AGENT_INTERNAL_API_KEY")" \
        -d '{"dry_run":false}'
    envVars:
      - key: SALES_SUPPORT_AGENT_URL
        sync: false
      - key: SALES_AGENT_INTERNAL_API_KEY
        sync: false

  - type: cron
    name: sales-support-gmail-sync
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: |
      curl -sS -X POST "$SALES_SUPPORT_AGENT_URL/api/jobs/gmail-sync/run" \
        -H "Content-Type: application/json" \
        -H "X-Internal-Api-Key: $(printf %s "$SALES_AGENT_INTERNAL_API_KEY")" \
        -d '{"dry_run":false}'
    envVars:
      - key: SALES_SUPPORT_AGENT_URL
        sync: false
      - key: SALES_AGENT_INTERNAL_API_KEY
        sync: false

  - type: cron
    name: sales-support-operator-review
    runtime: python
    schedule: "5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: |
      curl -sS -X POST "$SALES_SUPPORT_AGENT_URL/api/jobs/sales-operator/run" \
        -H "Content-Type: application/json" \
        -H "X-Internal-Api-Key: $(printf %s "$SALES_AGENT_INTERNAL_API_KEY")" \
        -d '{"dry_run":false,"limit":25,"run_hubspot_sync":true,"run_mailbox_sync":false,"trigger":"scheduled"}'
      curl -sS -X POST "$SALES_SUPPORT_AGENT_URL/api/jobs/hr-reminders/run" \
        -H "X-Internal-Api-Key: $(printf %s "$SALES_AGENT_INTERNAL_API_KEY")"
      curl -sS -X POST "$SALES_SUPPORT_AGENT_URL/api/jobs/building-holds/run" \
        -H "Content-Type: application/json" \
        -H "X-Internal-Api-Key: $(printf %s "$SALES_AGENT_INTERNAL_API_KEY")" \
        -d '{"dry_run":false}'
      curl -sS -X POST "$SALES_SUPPORT_AGENT_URL/api/internal/building/crm/scheduled-campaigns/run" \
        -H "Content-Type: application/json" \
        -H "X-Internal-Api-Key: $(printf %s "$SALES_AGENT_INTERNAL_API_KEY")" \
        -d '{"dry_run":false,"max_campaigns":10,"actor":"job:building-campaign-scheduler"}'
    envVars:
      - key: SALES_SUPPORT_AGENT_URL
        sync: false
      - key: SALES_AGENT_INTERNAL_API_KEY
        sync: false

  - type: cron
    name: agent-outbound-morning
    runtime: python
    # Render cron is UTC. Both possible Denver offsets are scheduled; the
    # endpoint accepts only the local 7 AM invocation.
    schedule: "0 13,14 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: |
      curl --fail --silent --show-error --max-time 3500 \
        -X POST "$SALES_SUPPORT_AGENT_URL/api/jobs/outbound-morning/run" \
        -H "X-Internal-Api-Key: $(printf %s "$SALES_AGENT_INTERNAL_API_KEY")"
    envVars:
      - key: SALES_SUPPORT_AGENT_URL
        value: https://agent.anatainc.com
      - key: SALES_AGENT_INTERNAL_API_KEY
        sync: false
