services:
  - type: web
    name: sales-support-agent
    runtime: python
    # Agent's combined admin and automation workload exceeded Starter's 512 MB
    # ceiling repeatedly in production. Standard provides 2 GB so Render does
    # not kill the only web instance during normal scheduled work.
    plan: standard
    # Website Ops currently maintains its report, quota, and publishing ledgers on
    # the service filesystem. Keep one writer until every ledger is database-backed.
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/predeploy_agent.py
    startCommand: uvicorn sales_support_agent.main:app --host 0.0.0.0 --port $PORT
